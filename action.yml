name: 'Slack Channel Management Action'
description: 'Creates a private Slack channel for a GitHub issue (e.g. when labeled "slack"), invites configured Slack users, archives the channel when a configured archive label is applied, and relays PR-opened / comment / edit activity on the issue into that channel.'
author: 'carlspring'
branding:
  icon: 'message-square'
  color: 'purple'

inputs:
  slack-bot-token:
    description: 'Slack Bot User OAuth token (xoxb-...). Needs channels:manage, groups:write, chat:write, users:read scopes.'
    required: true
  label:
    description: 'GitHub issue label that triggers channel creation.'
    required: false
    default: 'slack'
  archive-label:
    description: 'GitHub issue label that triggers archiving the channel. The channel is located by reconstructing its name from channel-prefix/repo/issue-number, so no stored state is needed.'
    required: false
    default: 'slack:archived'
  channel-prefix:
    description: 'Optional prefix used when building the channel name: <prefix>-<repo>-<issue-number> (or just <repo>-<issue-number> if left blank). Must match whatever was used at creation time, so archiving can find the right channel.'
    required: false
    default: ''
  invite-user-ids:
    description: 'Comma-separated list of people to invite to the channel. Each entry can be a Slack user ID (e.g. U0123ABCD) or a full name (e.g. "@Martin Todorov" or "Martin Todorov") — names are resolved to user IDs automatically via the Slack directory. Leave empty to invite no one.'
    required: false
    default: ''
  private:
    description: 'Whether the created channel should be private (true) or public (false).'
    required: false
    default: 'true'
  post-comment:
    description: 'Whether to post a comment back on the GitHub issue when the channel is created or archived.'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token used to post issue comments. Required if post-comment is true.'
    required: false
    default: ''
  ignore-bot-comments:
    description: 'Whether to skip relaying issue comments authored by bots (including this action''s own "channel created/archived" comments) to Slack.'
    required: false
    default: 'true'
  unarchive-on-reopen:
    description: 'Whether to unarchive the channel when the issue is reopened.'
    required: false
    default: 'true'

outputs:
  channel-id:
    description: 'Slack ID of the created (or pre-existing) channel.'
    value: ${{ steps.create.outputs.channel-id }}
  channel-name:
    description: 'Name of the created (or pre-existing) channel.'
    value: ${{ steps.create.outputs.channel-name }}
  channel-url:
    description: 'Clickable URL to the created (or pre-existing) Slack channel.'
    value: ${{ steps.create.outputs.channel-url }}
  skipped:
    description: '"true" if the action skipped channel creation because the trigger label was not present.'
    value: ${{ steps.create.outputs.skipped }}
  archived-channel-id:
    description: 'Slack ID of the archived channel, if archiving ran.'
    value: ${{ steps.archive.outputs.channel-id }}
  archived-channel-name:
    description: 'Name of the archived channel, if archiving ran.'
    value: ${{ steps.archive.outputs.channel-name }}
  archive-skipped:
    description: '"true" if archiving was skipped (archive label not present/not just added, or no matching channel found).'
    value: ${{ steps.archive.outputs.skipped }}
  unarchived-channel-id:
    description: 'Slack ID of the unarchived channel, if unarchiving ran.'
    value: ${{ steps.unarchive.outputs.channel-id }}
  unarchived-channel-name:
    description: 'Name of the unarchived channel, if unarchiving ran.'
    value: ${{ steps.unarchive.outputs.channel-name }}
  unarchive-skipped:
    description: '"true" if unarchiving was skipped (issue wasn''t reopened, unarchive-on-reopen is false, or no matching channel found).'
    value: ${{ steps.unarchive.outputs.skipped }}

runs:
  using: 'composite'
  steps:
    - id: create
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        ISSUE_LABEL: ${{ inputs.label }}
        CHANNEL_PREFIX: ${{ inputs.channel-prefix }}
        INVITE_USER_IDS: ${{ inputs.invite-user-ids }}
        CHANNEL_PRIVATE: ${{ inputs.private }}
      run: python3 ${{ github.action_path }}/scripts/create_channel.py

    - id: comment
      if: inputs.post-comment == 'true' && steps.create.outputs.skipped != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHANNEL_NAME: ${{ steps.create.outputs.channel-name }}
        CHANNEL_URL: ${{ steps.create.outputs.channel-url }}
      run: python3 ${{ github.action_path }}/scripts/post_comment.py

    - id: archive
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        ARCHIVE_LABEL: ${{ inputs.archive-label }}
        CHANNEL_PREFIX: ${{ inputs.channel-prefix }}
      run: python3 ${{ github.action_path }}/scripts/archive_channel.py

    - id: archive-comment
      if: inputs.post-comment == 'true' && steps.archive.outputs.skipped != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHANNEL_NAME: ${{ steps.archive.outputs.channel-name }}
        CHANNEL_URL: ${{ steps.archive.outputs.channel-url }}
      run: python3 ${{ github.action_path }}/scripts/post_archive_comment.py

    - id: unarchive
      if: github.event_name == 'issues' && github.event.action == 'reopened' && inputs.unarchive-on-reopen == 'true'
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        CHANNEL_PREFIX: ${{ inputs.channel-prefix }}
      run: python3 ${{ github.action_path }}/scripts/unarchive_channel.py

    - id: unarchive-comment
      if: inputs.post-comment == 'true' && steps.unarchive.outputs.skipped != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHANNEL_NAME: ${{ steps.unarchive.outputs.channel-name }}
        CHANNEL_URL: ${{ steps.unarchive.outputs.channel-url }}
      run: python3 ${{ github.action_path }}/scripts/post_reopen_comment.py

    - id: notify-pr
      if: github.event_name == 'pull_request' && github.event.action == 'opened'
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        CHANNEL_PREFIX: ${{ inputs.channel-prefix }}
      run: python3 ${{ github.action_path }}/scripts/notify_pr_opened.py

    - id: notify-comment
      if: github.event_name == 'issue_comment' && github.event.action == 'created'
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        CHANNEL_PREFIX: ${{ inputs.channel-prefix }}
        IGNORE_BOT_COMMENTS: ${{ inputs.ignore-bot-comments }}
      run: python3 ${{ github.action_path }}/scripts/notify_issue_comment.py

    - id: notify-edit
      if: github.event_name == 'issues' && github.event.action == 'edited'
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        CHANNEL_PREFIX: ${{ inputs.channel-prefix }}
      run: python3 ${{ github.action_path }}/scripts/notify_issue_edited.py


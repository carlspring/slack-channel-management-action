name: Slack channel management for issues

on:
  issues:
    types: [opened, labeled, edited, reopened]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write   # only needed if post-comment is left enabled

jobs:
  slack-channel-management:
    runs-on: ubuntu-latest
    steps:
      - name: Manage Slack channel for this issue
        uses: carlspring/slack-channel-management-action@v1
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          label: slack
          archive-label: ${{ vars.SLACK_ARCHIVE_LABEL || 'slack:archived' }}
          channel-prefix: ${{ vars.SLACK_CHANNEL_PREFIX }}       # e.g. "ol"
          invite-user-ids: ${{ vars.SLACK_INVITE_USER_IDS }}     # e.g. "U0123ABCD,@Martin Todorov"
          private: true
          post-comment: true
          ignore-bot-comments: true
          unarchive-on-reopen: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
